name: Compilar soluciones

on:
  pull_request:
    paths: ["**/*.cs"]
  push:
    branches: [main]
    paths: ["**/*.cs"]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Elegir ficheros a compilar
        id: ficheros
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Solo los .cs añadidos o modificados en la propuesta
            git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- '*.cs' > ficheros.txt
          else
            # En main o a mano: todas las soluciones
            find . -path '*/soluciones/*' -name '*.cs' | sort > ficheros.txt
          fi
          echo "Ficheros a compilar:"; cat ficheros.txt

      - name: Comprobar ubicación
        if: github.event_name == 'pull_request'
        run: |
          mal=0
          while read -r f; do
            if ! echo "$f" | grep -Eq '^[0-9]{2}-[^/]+/[^/]+/soluciones/[^/]+/Program\.cs$'; then
              echo "::error file=$f::Debe estar en TEMA/EJERCICIO/soluciones/TU-USUARIO/Program.cs"
              mal=1
            fi
          done < ficheros.txt
          exit $mal

      - name: Compilar
        env:
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          fallos=0
          while read -r f; do
            [ -z "$f" ] && continue
            echo "::group::$f"
            if dotnet build "$f" -nologo -v q; then
              echo "✅ compila"
            else
              echo "::error file=$f::No compila"
              fallos=$((fallos + 1))
            fi
            echo "::endgroup::"
          done < ficheros.txt
          echo "Ficheros con errores: $fallos"
          [ "$fallos" -eq 0 ]
